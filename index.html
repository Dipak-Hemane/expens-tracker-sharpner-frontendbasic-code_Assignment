<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expenses Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
</head>
<body class="container mt-4">
    <h1 class="text-center mb-4">Expenses Tracker</h1>
    <form id="expenseForm" class="p-4 border rounded bg-light shadow mx-auto" style="max-width: 450px;">
        <label for="expense-name" class="form-label fw-bold">Expense Name:</label>
        <input type="text" id="expense-name" name="expense-name" class="form-control mb-3" required>
        <label for="description" class="form-label fw-bold"> Expense Description:</label>
        <input type="text" id="description" name="description" class="form-control mb-3" required>
        <label for="amount" class="form-label fw-bold">Expense Amount:</label>
        <input type="number" id="amount" name="expense-amount" class="form-control mb-3" required>
        <select id="category" name="category" class="form-control mb-3" required>
            <option value="movie">Movie</option>
            <option value="food">Food</option>
            <option value="ransportation">Transportation</option>
            <option value="fuel">Fuel</option>
            <option value="eletisity">Electricity</option>
        </select>
        <button type="submit" class="btn btn-primary w-100">Add Expense</button>
    </form>
    <ul id="submitted-input"class="list-groupmt-4"></ul>
    <script src="form.js"></script>
</body>
</html>
